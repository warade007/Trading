<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broker Settings · Research Lab</title>
<style>
:root{color-scheme:dark;font:16px/1.6 Segoe UI,system-ui,sans-serif;background:#10181e;color:#e2ecef}*{box-sizing:border-box}body{margin:0}.safety{background:#f4d582;color:#2e2612;padding:12px;text-align:center;font-weight:bold}main{max-width:1000px;margin:auto;padding:24px}nav{display:flex;justify-content:space-between;align-items:center}a{color:#80e1c5}h1{font-size:30px}h2{font-size:20px}.card{background:#18242c;border:1px solid #2b3c46;border-radius:10px;padding:24px;margin:20px 0}label{display:block;font-weight:600;margin:15px 0 6px}input:not([type=checkbox]):not([type=hidden]){display:block;width:100%;padding:12px;background:#10181e;color:#fff;border:1px solid #687d87;border-radius:6px}input[type=checkbox]{width:20px;height:20px}button{padding:10px 18px;border:1px solid #80e1c5;border-radius:6px;background:#254b42;color:#fff;cursor:pointer;margin:10px 0}.danger{border-color:#f69e9e;background:#522f35}.muted,.helptext{color:#a5b7c0;font-size:14px}.errorlist,.error{color:#ffb9ae}.notice{border-left:3px solid #f4d582;background:#29291f;padding:12px 18px;margin:15px 0}.actions{display:flex;gap:16px;flex-wrap:wrap}dl{display:grid;grid-template-columns:1fr 2fr;gap:12px}dd{margin:0}dt{color:#a5b7c0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;text-align:left;border-bottom:1px solid #2b3c46}.scroll{overflow:auto}code{overflow-wrap:anywhere}@media(max-width:600px){dl{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><div class="safety">RESEARCH ONLY — LIVE ORDERS DISABLED</div><main>
<nav><a href="/">← Research dashboard</a>{% if user.is_authenticated %}<form method="post" action="{% url 'administrator_logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>{% endif %}</nav>
{% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
<p class="muted">Localhost only · No live-trading controls · No secrets in browser storage</p></main></body></html>
